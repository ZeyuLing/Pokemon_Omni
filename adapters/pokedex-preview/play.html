<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Omni · 真新镇</title><link rel="stylesheet" href="/style.css"></head>
<body data-game="pallet"><main class="gba-shell">
<a href="/">图鉴资料</a><h1>Pokémon Omni · 真新镇</h1>
<p class="facts">当前为图鉴调试版：启动后直接打开游戏内图鉴，无需领取伙伴或推进剧情。图鉴列表按 B 可返回游戏标题。</p>
<div id="emulator-status" role="status">正在启动游戏…</div>
<canvas id="gba-screen" width="240" height="160" tabindex="0" role="img" aria-label="真新镇游戏画面；方向键移动，Z确认，X返回或跑步，Enter打开菜单"></canvas>
<div class="gba-controls" aria-label="游戏按键"><button data-key="64">↑</button><button data-key="128">↓</button><button data-key="32">←</button><button data-key="16">→</button><button data-key="1">A 交互</button><button data-key="2">B 返回／跑步</button><button data-key="8">START 菜单</button><button data-key="512">L</button><button data-key="256">R</button><button data-key="4">SELECT</button></div>
<p class="facts">点击画面后使用键盘：方向键移动，Z 确认／交谈，X 返回，按住 X 配合方向键跑步，Enter 打开菜单。图鉴中 A / S 为 L / R，Shift 为 SELECT。</p>
<div class="entry-actions"><button id="gba-pause">暂停</button><button id="gba-audio">开启音效</button><button id="gba-export">导出游戏存档</button><label class="file-button">导入游戏存档<input id="gba-import" type="file" accept=".sav"></label><a href="/omni-pallet.gba" download>下载 GBA 游戏</a></div>
<p class="facts">从游戏菜单选择“保存”，下次在标题画面选择“继续冒险”。领取伙伴、恢复与完成练习战也会保存。本版本包含真新镇及镇内建筑；其他地区、完整对战机制与背景音乐仍在开发。存档与独立图鉴程序分开保存。</p>
</main><script src="/emulator/mgba.js"></script><script src="/gba-save.js"></script><script src="/pallet-save.js"></script><script src="/gba-player.js"></script></body></html>
